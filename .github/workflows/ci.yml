name: Shebora CI

on:
  push:
    branches:
      - main
      - shebora-improvements
  pull_request:
    branches:
      - main
      - shebora-improvements
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shebora-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build-and-tests:
    name: Test and build Shebora
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Build frontend for production
        run: npm run build
